name: Licensing

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every file has a licence (REUSE)
        run: |
          python3 -m pip install --disable-pip-version-check reuse==6.3.0
          reuse lint
